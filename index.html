<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QRコード受付システム（デバッグモード）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f5f5f5; }
    #camera-view { max-width: 500px; margin: 0 auto; }
    #reader { width: 100%; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #result-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; color: white; }
    .title { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    .message { font-size: 16px; padding: 0 20px; line-height: 1.6; text-align: left; background: rgba(0,0,0,0.3); border-radius: 8px; margin: 10px; }
  </style>
</head>
<body>

  <div id="camera-view">
    <h2>QRコードをかざしてください</h2>
    <div id="reader"></div>
  </div>

  <div id="result-view">
    <div class="title" id="res-title"></div>
    <div class="message" id="res-msg"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw-K1A33R9OXbObYzOY1PX__KSveZvMQq0AQ71vr3B0DWcdz9b43jQaonm--0zanen3/exec";

    let html5QrcodeScanner;

    function startScanner() {
      document.getElementById('camera-view').style.display = 'block';
      document.getElementById('result-view').style.display = 'none';

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).catch(err => alert("カメラ起動エラー: " + err));
    }

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.stop().then(() => {
        let rawText = decodedText.trim();
        let uuid = rawText;

        if (rawText.includes('uuid=')) {
          try {
            let partAfterUuid = rawText.split('uuid=')[1];
            uuid = partAfterUuid.split('&')[0].split('#')[0].split('/')[0];
          } catch (e) {}
        }

        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ uuid: uuid })
        })
        .then(res => res.json())
        .then(response => {
          onCheckInResponse(response, rawText, uuid);
        })
        .catch(err => {
          alert("通信エラーが発生しました: " + err);
          startScanner();
        });
      });
    }

    function onCheckInResponse(response, rawText, extractedUuid) {
      const cameraView = document.getElementById('camera-view');
      const resultView = document.getElementById('result-view');
      
      cameraView.style.display = 'none';
      resultView.style.display = 'flex';

      resultView.style.backgroundColor = response.bg;
      document.getElementById('res-title').innerHTML = response.title;
      
      // デバッグ情報を画面に詳しく表示
      let debugInfo = `<p>${response.msg}</p><hr>`;
      debugInfo += `<p><b>【カメラが読み取った生の文字】</b><br>${rawText}</p>`;
      debugInfo += `<p><b>【抽出してGASに送ったUUID】</b><br>${extractedUuid}</p>`;
      debugInfo += `<br><small>【タップでカメラに戻る】</small>`;

      document.getElementById('res-msg').innerHTML = debugInfo;

      resultView.onclick = function() {
        resultView.onclick = null;
        startScanner();
      };
    }

    window.onload = startScanner;
  </script>
</body>
</html>
